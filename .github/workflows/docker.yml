name: docker
on:
  push:
    branches: [main]
    paths: ["ev-platform/**", ".github/workflows/docker.yml"] # guide/ edits don't need a new image
  pull_request:
    paths: ["ev-platform/**", ".github/workflows/docker.yml"]

permissions:
  contents: read
  packages: write # lets GITHUB_TOKEN push to ghcr.io

jobs:
  api-image:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (a tag can be moved; a SHA can't). Dependabot updates them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./ev-platform # the app lives in this subfolder of the git repo
          push: ${{ github.event_name == 'push' }}
          # Image names must be lowercase (GitHub username HarshVanetiya -> harshvanetiya)
          tags: |
            ghcr.io/harshvanetiya/ev-api:latest
            ghcr.io/harshvanetiya/ev-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
